<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>A股策略看板</title>
    <link rel="icon" href="{{ url_for('static', filename='trader-mark.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ web_asset('dashboard_base.css') }}" />
    <link rel="stylesheet" href="{{ web_asset('dashboard_components.css') }}" />
    <link rel="stylesheet" href="{{ web_asset('dashboard_responsive.css') }}" />
    <script defer src="{{ web_asset('render.js') }}"></script>
    <script defer src="{{ web_asset('selection.js') }}"></script>
    <script defer src="{{ web_asset('long_watchlist_data.js') }}"></script>
    <script defer src="{{ web_asset('long_groups.js') }}"></script>
    <script defer src="{{ web_asset('dashboard_formatters.js') }}"></script>
    <script defer src="{{ web_asset('dashboard_patches.js') }}"></script>
    <script defer src="{{ web_asset('status_view.js') }}"></script>
    <script defer src="{{ web_asset('dashboard.js') }}"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand" aria-label="A股策略看板">
        <img src="{{ url_for('static', filename='trader-mark.svg') }}" alt="" width="32" height="32" />
        <div>
          <h1>A股策略看板</h1>
          <span id="marketPhase">等待运行时</span>
        </div>
      </div>
      <div class="runtime-strip" aria-label="运行状态">
        <span><i id="runtimeDot" class="status-dot" data-state="idle"></i><b id="runtimeStatus">未启动</b></span>
        <span>推送 <b id="streamStatus">连接中</b></span>
        <span>评分 <b id="scoreTime">-</b></span>
      </div>
      <button id="refreshButton" class="icon-button" type="button" title="刷新当前策略" aria-label="刷新当前策略">
        <svg class="lucide-icon" aria-hidden="true"><use href="{{ url_for('static', filename='lucide.svg') }}#refresh-cw"></use></svg>
      </button>
      <div class="runtime-messages" aria-label="快照状态与最近错误">
        <div id="notice" class="runtime-message notice" data-level="idle" role="status" aria-live="polite">
          <div class="runtime-message-heading"><span>快照状态</span><b id="snapshotStrategy">今早</b></div>
          <strong id="noticeText">正在读取推荐快照</strong>
          <small id="snapshotMeta">等待行情与策略数据</small>
        </div>
        <div id="healthPanel" class="runtime-error runtime-message" data-level="normal" role="status" aria-live="polite">
          <div class="runtime-message-heading">
            <span>最近错误</span>
            <div class="health-actions">
              <b id="healthBadge">正常 · 无最近错误</b>
              <button id="errorDetailsButton" class="text-button" type="button" aria-controls="errorDrawer" aria-expanded="false" hidden>查看全部</button>
            </div>
          </div>
          <strong id="lastError">系统运行正常</strong>
          <small id="lastErrorMeta">当前没有活动问题</small>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="summary-band" aria-label="推荐摘要">
        <div class="summary-item"><span>数据新鲜度</span><strong id="quoteAge">-</strong><small><b id="quoteSource">-</b> · <b id="quoteTime">-</b></small></div>
        <div class="summary-item"><span>候选覆盖</span><strong id="coverageStatus">-</strong><small id="coverageMeta">已评估 / 总候选</small></div>
        <div class="summary-item"><span>推荐漏斗</span><strong id="funnelStatus">-</strong><small id="funnelMeta">候选 / 评分 / 正式</small></div>
        <div class="summary-item"><span>模型预算</span><strong id="budgetStatus">-</strong><small id="budgetMeta">已用 / 剩余 / 上限</small></div>
        <div class="summary-item"><span>冻结状态</span><strong id="headerFreeze">-</strong><small id="freezeMeta">等待策略快照</small></div>
      </section>

      <section class="control-band" aria-label="策略和日期">
        <div class="strategy-choice">
          <nav class="strategy-tabs" role="tablist" aria-label="推荐策略" aria-describedby="strategyDescription">
            <button class="strategy-tab is-active" type="button" role="tab" aria-selected="true" data-strategy="today">今早</button>
            <button class="strategy-tab" type="button" role="tab" aria-selected="false" data-strategy="tomorrow">明日</button>
            <button class="strategy-tab" type="button" role="tab" aria-selected="false" data-strategy="d25">2-5日</button>
            <button class="strategy-tab" type="button" role="tab" aria-selected="false" data-strategy="long">长期</button>
          </nav>
          <p id="strategyDescription" class="strategy-description" aria-live="polite">
            盘中短线 · 面向 T+1 · 11:20 冻结
          </p>
          <nav id="longScopeTabs" class="long-scope-tabs" role="tablist" aria-label="长期研究类别" hidden>
            <button class="long-scope-tab is-active" type="button" role="tab" aria-selected="true" data-scope="chokepoint">卡脖子行业</button>
            <button class="long-scope-tab" type="button" role="tab" aria-selected="false" data-scope="future_growth">高成长赛道</button>
            <button class="long-scope-tab" type="button" role="tab" aria-selected="false" data-scope="low_price_potential">低价潜力股</button>
          </nav>
        </div>
        <label class="date-control">
          <span>推荐日期</span>
          <select id="dateSelect" aria-label="推荐日期">
            <option value="">当前</option>
          </select>
        </label>
      </section>

      <section id="recommendation-layout" class="recommendation-layout" aria-label="推荐列表">
        <aside id="long-sidebar" class="long-sidebar" aria-label="长期研究分组" hidden>
          <header class="long-panel-heading">
            <div>
              <span>重点研究方向</span>
              <h2 id="long-panel-title">卡脖子行业</h2>
            </div>
            <b id="long-panel-meta">-</b>
          </header>
          <nav id="longIndustryTabs" class="long-industry-tabs" role="tablist" aria-label="长期行业赛道"></nav>
        </aside>

        <section class="table-region" aria-label="股票信息">
          <header id="longStockHeader" class="long-stock-header" hidden>
            <div>
              <span>长期重点观察池</span>
              <h2>重点股票行情</h2>
            </div>
            <b id="longStockContext">请选择左侧行业</b>
          </header>
          <div class="table-scroll">
            <table id="recommendationTable">
              <colgroup id="tableColumns"></colgroup>
              <thead id="tableHead"></thead>
              <tbody id="tableBody">
                <tr><td class="table-state" colspan="9">加载中</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="observationPool" class="observation-pool" aria-label="观察池" hidden>
        <header class="observation-heading">
          <div>
            <span>观察池</span>
            <h2>不可执行，仅供观察</h2>
          </div>
          <b id="observationPoolMeta">0 / 6</b>
        </header>
        <div class="table-scroll">
          <table id="observationTable">
            <colgroup id="observationColumns"></colgroup>
            <thead id="observationHead"></thead>
            <tbody id="observationBody">
              <tr><td class="table-state" colspan="9">加载中</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="detailDrawer" class="detail-drawer" aria-hidden="true" aria-labelledby="drawerTitle">
      <header class="drawer-header">
        <div>
          <span id="drawerCode" class="drawer-code">-</span>
          <h2 id="drawerTitle">股票详情</h2>
        </div>
        <button id="drawerClose" class="icon-button" type="button" title="关闭详情" aria-label="关闭详情">
          <svg class="lucide-icon" aria-hidden="true"><use href="{{ url_for('static', filename='lucide.svg') }}#x"></use></svg>
        </button>
      </header>
      <div id="drawerContent" class="drawer-content"></div>
    </aside>

    <aside id="errorDrawer" class="detail-drawer error-drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="errorDrawerTitle">
      <header class="drawer-header">
        <div>
          <span class="drawer-code">系统状态</span>
          <h2 id="errorDrawerTitle">最近错误</h2>
        </div>
        <button id="errorDrawerClose" class="icon-button" type="button" title="关闭错误详情" aria-label="关闭错误详情">
          <svg class="lucide-icon" aria-hidden="true"><use href="{{ url_for('static', filename='lucide.svg') }}#x"></use></svg>
        </button>
      </header>
      <div id="errorDrawerContent" class="drawer-content error-drawer-content"></div>
    </aside>

    <noscript>此看板需要浏览器启用 JavaScript。</noscript>
  </body>
</html>
