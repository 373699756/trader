<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>A股 V2 决策工作台</title>
    <link rel="icon" href="{{ url_for('static', filename='trader-mark.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ web_asset('dashboard.css') }}" />
    <script defer src="{{ web_asset('render.js') }}"></script>
    <script defer src="{{ web_asset('long_watchlist_data.js') }}"></script>
    <script defer src="{{ web_asset('long_groups.js') }}"></script>
    <script defer src="{{ web_asset('dashboard.js') }}"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="{{ url_for('static', filename='trader-mark.svg') }}" alt="" width="36" height="36" />
        <div><h1>A股 V2 决策工作台</h1><span>统一当前、历史与运行状态</span></div>
      </div>
      <div class="header-status" aria-label="运行状态">
        <span><i id="runtimeDot" class="status-dot"></i><b id="runtimeStatus">读取中</b></span>
        <span>事件流 <b id="streamStatus">连接中</b></span>
        <span>交易日 <b id="tradeDate">-</b></span>
      </div>
      <button id="refreshButton" class="refresh-button" type="button">刷新</button>
    </header>

    <main class="workspace">
      <section class="toolbar" aria-label="策略和日期">
        <nav id="strategyTabs" class="strategy-tabs" aria-label="策略">
          <button class="is-active" data-strategy="today" type="button">Today</button>
          <button data-strategy="tomorrow" type="button">Tomorrow</button>
          <button data-strategy="d25" type="button">D2-5</button>
          <button data-strategy="long" type="button">Long</button>
        </nav>
        <label class="date-control"><span>查看</span><select id="dateSelect"><option value="">当前</option></select></label>
        <div id="viewLabel" class="view-label">当前决策</div>
        <nav id="longScopeTabs" class="long-scope-tabs" aria-label="长期研究类别" hidden>
          <button class="long-scope-tab is-active" type="button" aria-selected="true" data-scope="chokepoint">卡脖子行业</button>
          <button class="long-scope-tab" type="button" aria-selected="false" data-scope="future_growth">高成长赛道</button>
          <button class="long-scope-tab" type="button" aria-selected="false" data-scope="low_price_potential">低价潜力股</button>
        </nav>
      </section>

      <section id="metricGrid" class="metric-grid" aria-label="决策指标">
        <article><span>数据年龄</span><strong id="dataAge">-</strong><small id="observedAt">尚无数据</small></article>
        <article><span>覆盖</span><strong id="coverage">-</strong><small id="coverageDetail">候选 / 已评估</small></article>
        <article><span>漏斗</span><strong id="funnel">-</strong><small id="funnelDetail">过滤 / 入选</small></article>
        <article><span>模型预算</span><strong id="budget">-</strong><small>已用 / 剩余 / 上限</small></article>
        <article><span>冻结</span><strong id="freeze">-</strong><small id="freezeDetail">当前滚动结果</small></article>
        <article class="degraded-card"><span>降级状态</span><strong id="degraded">读取中</strong><small id="lastError">最近错误：无</small></article>
      </section>

      <section id="genericLayout" class="content-grid">
        <section class="table-panel" aria-label="逐股诊断">
          <header><div><span>逐股诊断</span><h2 id="panelTitle">Today 当前决策</h2></div><b id="itemCount">0 项</b></header>
          <div class="table-scroll">
            <table id="decisionTable">
              <thead><tr><th>排名</th><th>股票</th><th>分组 / 行业</th><th>行情</th><th>本地分</th><th>模型分</th><th>最终分</th><th>动作</th><th>风险 / 原因</th></tr></thead>
              <tbody id="decisionRows"><tr><td colspan="9" class="empty-state">加载中</td></tr></tbody>
            </table>
          </div>
        </section>
        <aside class="identity-panel" aria-label="决策身份">
          <span>决策身份</span>
          <h2 id="decisionStage">-</h2>
          <dl>
            <div><dt>状态</dt><dd id="decisionStatus">-</dd></div>
            <div><dt>评分</dt><dd id="scoreStatus">-</dd></div>
            <div><dt>版本</dt><dd id="decisionVersion">-</dd></div>
            <div><dt>数据版本</dt><dd id="inputVersions">-</dd></div>
            <div><dt>过滤诊断</dt><dd id="filterReasons">-</dd></div>
          </dl>
        </aside>
      </section>

      <section id="longLayout" class="long-layout" aria-label="长期固定研究池" hidden>
        <aside id="long-sidebar" class="long-sidebar" aria-label="长期研究分组">
          <header class="long-panel-heading">
            <div>
              <span>重点研究方向</span>
              <h2 id="long-panel-title">卡脖子行业</h2>
            </div>
            <b id="long-panel-meta">-</b>
          </header>
          <nav id="longIndustryTabs" class="long-industry-tabs" role="tablist" aria-label="长期行业赛道"></nav>
        </aside>

        <section class="long-table-panel" aria-label="固定股票行情">
          <header id="longStockHeader" class="long-stock-header">
            <div>
              <span>长期重点观察池</span>
              <h2>重点股票行情</h2>
            </div>
            <div class="long-stock-meta">
              <b id="longStockContext">请选择左侧行业</b>
              <small id="longStatus">读取中</small>
            </div>
          </header>
          <div class="table-scroll">
            <table id="longTable">
              <colgroup id="longColumns"></colgroup>
              <thead id="longHead"></thead>
              <tbody id="longRows"><tr><td colspan="7" class="empty-state">加载中</td></tr></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <footer>仅供研究，不构成投资建议</footer>
  </body>
</html>
