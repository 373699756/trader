<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>明日决策</title>
    <link rel="icon" href="{{ url_for('static', filename='trader-mark.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ web_asset('tomorrow_v2.css') }}" />
    <script defer src="{{ web_asset('tomorrow_v2.js') }}"></script>
  </head>
  <body>
    <header class="v2-header">
      <div class="v2-brand">
        <img src="{{ url_for('static', filename='trader-mark.svg') }}" alt="" width="34" height="34" />
        <div>
          <h1>明日决策</h1>
          <span id="tradeDate">当前交易日</span>
        </div>
      </div>
      <div class="v2-runtime" aria-label="运行状态">
        <span><i id="runtimeDot" class="state-dot" data-state="idle"></i><b id="runtimeState">等待数据</b></span>
        <span>行情年龄 <b id="dataAge">-</b></span>
        <span>推送 <b id="streamState">连接中</b></span>
        <span>模型额度 <b id="budgetState">-</b></span>
        <span>冻结 <b id="freezeState">-</b></span>
      </div>
      <button id="refreshButton" class="icon-button" type="button" title="刷新" aria-label="刷新">
        <svg aria-hidden="true"><use href="{{ url_for('static', filename='lucide.svg') }}#refresh-cw"></use></svg>
      </button>
    </header>

    <main class="v2-workspace">
      <section class="status-band" aria-label="决策状态">
        <div class="status-primary">
          <span>快照状态</span>
          <strong id="snapshotState">正在读取</strong>
        </div>
        <div class="status-secondary">
          <span>降级与失败</span>
          <strong id="degradedState">无</strong>
        </div>
      </section>

      <section class="summary-band" aria-label="决策摘要">
        <div><span>入选</span><b id="selectedCount">-</b></div>
        <div><span>已评分</span><b id="evaluatedCount">-</b></div>
        <div><span>已过滤</span><b id="rejectedCount">-</b></div>
        <div><span>阶段</span><b id="projectionStage">-</b></div>
        <div><span>最高评分</span><b id="highestScore">-</b></div>
        <div><span>行情源</span><b id="quoteSource">-</b></div>
      </section>

      <section class="control-band" aria-label="日期">
        <button id="currentButton" class="mode-button is-active" type="button">当前</button>
        <label>
          <span>历史日期</span>
          <input id="historyDate" type="date" aria-label="历史日期" />
        </label>
        <span id="viewState" class="view-state">当前决策</span>
      </section>

      <section class="decision-layout" aria-label="明日决策结果">
        <div class="table-region">
          <table id="tomorrowDecisionTable">
            <colgroup>
              <col class="rank-col" />
              <col class="stock-col" />
              <col class="industry-col" />
              <col class="price-col" />
              <col class="change-col" />
              <col class="score-col" />
              <col class="action-col" />
              <col class="time-col" />
            </colgroup>
            <thead>
              <tr>
                <th>排名</th>
                <th>股票</th>
                <th>行业</th>
                <th>现价</th>
                <th>涨跌</th>
                <th>最终分</th>
                <th>动作</th>
                <th>行情时间</th>
              </tr>
            </thead>
            <tbody id="decisionRows">
              <tr><td class="table-message" colspan="8">加载中</td></tr>
            </tbody>
          </table>
        </div>

        <aside class="detail-region" aria-label="决策详情">
          <header>
            <span>决策详情</span>
            <h2 id="detailTitle">尚未选择股票</h2>
            <b id="detailCode">-</b>
          </header>
          <dl id="detailFacts" class="detail-facts">
            <div><dt>动作</dt><dd>-</dd></div>
            <div><dt>本地分</dt><dd>-</dd></div>
            <div><dt>模型分</dt><dd>-</dd></div>
            <div><dt>风险扣分</dt><dd>-</dd></div>
          </dl>
          <section class="detail-section">
            <span>结论</span>
            <p id="detailReason">-</p>
          </section>
          <section class="detail-section">
            <span>风险</span>
            <p id="detailRisk">-</p>
          </section>
          <section class="detail-section">
            <span>身份</span>
            <p id="detailIdentity">-</p>
          </section>
        </aside>
      </section>
    </main>

    <footer>仅供研究，不构成投资建议</footer>
  </body>
</html>
