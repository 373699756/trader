[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = src
addopts = -q --strict-markers
markers =
    unit: isolated unit tests
    component: component boundary tests
    integration: cross-component integration tests
    contract: architecture and public contract tests
    performance: performance acceptance tests
    js: JavaScript consumer tests
    train: training, research, replay, holdout, and evaluation tests
    history: download, archive, maintenance, and conversion tests
    recommendation: recommendation, delivery, and Web tests
    crosscut: shared architecture, entrypoint, packaging, and cross-business tests
    slow: tests that intentionally exercise slow or release-scale behavior
    slow_history: history archive or historical data test
    slow_migration: data conversion or migration test
    slow_runtime: recommendation scheduler, worker, or shutdown timing test
    slow_supplier: recommendation supplier, gateway, reference, or cache timing test
