[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-research-dashboard"
version = "0.2.0"
description = "Local A-share recommendation research dashboard"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "akshare>=1.14.0",
    "openpyxl>=3.1,<4",
    "Flask>=2.2,<3.1",
    "lightgbm>=4.7,<5",
    "numpy>=2,<3",
    "polars>=1.43,<2",
    "requests>=2.22.0",
    "tushare>=1.4,<2",
]

[project.optional-dependencies]
research = [
    "baostock>=0.9.3,<1",
]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7.10,<8",
    "mypy>=1.18,<3",
    "pytest>=7,<9",
    "pytest-xdist>=3,<4",
    "ruff==0.15.21",
    "websocket-client>=1.8,<2",
]

[project.scripts]
trader-server = "trader.entrypoints.server:main"
trader-cli = "trader.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trader*"]

[tool.setuptools.package-data]
"trader.web" = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/vendor/*",
]
"trader.resources.models" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".runtime", ".venv", "docs/archive"]

[tool.ruff.lint]
# Keep the repository-wide baseline focused on correctness. New and migrated
# modules use the strict rule set in `make lint`.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src/trader"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["lightgbm", "numpy", "polars", "polars.*"]
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["trader"]

[tool.coverage.report]
fail_under = 50
precision = 2
show_missing = true
skip_empty = true
